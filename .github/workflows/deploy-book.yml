name: Deploy Jupyter Book

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: book/requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter-book
          pip install -r book/requirements.txt
          pip install -e .

      - name: Build book
        run: |
          rm -rf _build
          jupyter-book clean book --all
          jupyter-book build book --path-output .

      - name: Prepare Pages artifact
        run: |
          if [ ! -d _build/html ]; then
            echo "::error file=.github/workflows/deploy-book.yml,line=48,title=Missing build output::Expected _build/html after jupyter-book build."
            exit 1
          fi
          rm -rf _build/html/_build _build/html/_sources/_build _build/html/reports || {
            echo "::error file=.github/workflows/deploy-book.yml,line=52,title=Cleanup failed::Could not remove generated subdirectories from _build/html."
            exit 1
          }
          rm -f _build/html/.buildinfo || {
            echo "::error file=.github/workflows/deploy-book.yml,line=56,title=Cleanup failed::Could not remove _build/html/.buildinfo."
            exit 1
          }
          touch _build/html/.nojekyll || {
            echo "::error file=.github/workflows/deploy-book.yml,line=60,title=Marker creation failed::Could not create _build/html/.nojekyll."
            exit 1
          }

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
