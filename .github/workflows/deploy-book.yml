name: Deploy Jupyter Book

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: book/requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter-book
          pip install -r book/requirements.txt
          pip install -e .

      - name: Build book
        run: |
          jupyter-book clean book --all
          jupyter-book build book --path-output book

      - name: Prepare Pages artifact
        run: |
          if [ ! -d book/_build/html ]; then
            echo "::error file=.github/workflows/deploy-book.yml,line=48,title=Missing build output::Expected book/_build/html after jupyter-book build."
            exit 1
          fi
          rm -rf book/_build/html/_build book/_build/html/_sources/_build book/_build/html/reports || {
            echo "::error file=.github/workflows/deploy-book.yml,line=52,title=Cleanup failed::Could not remove generated subdirectories from book/_build/html."
            exit 1
          }
          rm -f book/_build/html/.buildinfo || {
            echo "::error file=.github/workflows/deploy-book.yml,line=56,title=Cleanup failed::Could not remove book/_build/html/.buildinfo."
            exit 1
          }
          touch book/_build/html/.nojekyll || {
            echo "::error file=.github/workflows/deploy-book.yml,line=60,title=Marker creation failed::Could not create book/_build/html/.nojekyll."
            exit 1
          }

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book/_build/html
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
