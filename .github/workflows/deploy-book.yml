name: Deploy Jupyter Book

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: book/requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter-book
          pip install -r book/requirements.txt
          pip install -e .

      - name: Build book
        run: |
          jupyter-book clean book --all
          jupyter-book build book

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R book/_build/html/. _site/
          rm -rf _site/_build _site/reports _site/_sources/_build
          find _site -depth -mindepth 1 -name '.*' ! -name '.nojekyll' -exec rm -rf {} +
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
