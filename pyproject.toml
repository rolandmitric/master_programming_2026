[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theochem2026"
version = "0.1.0"
description = "Teaching package for programming in theoretical chemistry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "numba",
  "requests",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel",
  "ipywidgets",
  "jupyterlab",
  "matplotlib",
  "pyvista",
  "trame",
  "trame-vtk",
  "trame-vuetify",
  "aiohttp>=3.9,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
